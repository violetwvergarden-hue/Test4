name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rapikan struktur folder
        run: |
          J=app/src/main/java/id/mangascreen/translator
          R=app/src/main/res
          mkdir -p $J $R/layout $R/values $R/drawable $R/mipmap-anydpi-v26
          mv -f AndroidManifest.xml app/src/main/
          mv -f *.kt $J/
          mv -f activity_main.xml $R/layout/
          mv -f colors.xml strings.xml themes.xml $R/values/
          mv -f ic_launcher.xml ic_launcher_round.xml $R/mipmap-anydpi-v26/
          mv -f ic_launcher_background.xml ic_launcher_foreground.xml $R/drawable/
          mv -f proguard-rules.pro app/

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'id.mangascreen.translator'
              compileSdk 34
              defaultConfig {
                  applicationId "id.mangascreen.translator"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-rules-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ".debug"
                      versionNameSuffix "-debug"
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.google.mlkit:text-recognition:16.0.0'
              implementation 'com.google.mlkit:text-recognition-japanese:16.0.0'
              implementation 'com.google.mlkit:text-recognition-korean:16.0.0'
              implementation 'com.google.mlkit:translate:17.0.2'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
          }
          EOF

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MangaScreenTranslator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
